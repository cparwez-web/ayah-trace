<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c1713" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5efe0" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ayah Trace">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Ayah Trace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap">
<style>
:root{--bg:#f5efe0;--surface:#fffcf4;--text:#1c2b24;--muted:#6b7a70;--accent:#0f6b4f;--on:#fff;--gold:#b8892b;--goldsoft:rgba(184,137,43,.38);--glow:rgba(184,137,43,.16);--ink:#10261c;--ghost:#1c2b24;--line:rgba(28,43,36,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1713;--surface:#13221b;--text:#ecefe6;--muted:#8fa196;--accent:#3fb98a;--on:#06281c;--gold:#d9b25a;--goldsoft:rgba(217,178,90,.38);--glow:rgba(217,178,90,.12);--ink:#dfeadf;--ghost:#eae6da;--line:rgba(206,220,214,.12)}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input[type=range]{touch-action:pan-x}
body{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
header b{font-size:15px}
#title{font-weight:700;border:none;background:none;padding:6px 0;font-size:15px}
#picker{display:none;flex-direction:column;gap:8px;padding:0 14px 10px}
#picker.show{display:flex}
#picker .row{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
select,input[type=number]{font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);min-width:0}
#sur,#juz{flex:1}
input[type=number]{width:64px;-webkit-user-select:text;user-select:text}
#prog{overflow-x:auto}
.dot{flex-shrink:0}
a{color:var(--accent)}
.nav{display:flex;align-items:center;gap:8px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#modes{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto}
#modes button{white-space:nowrap}
#stage{position:relative;flex:1;margin:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:200px}
#ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;direction:rtl;font-family:'Amiri Quran','Scheherazade New','Amiri',serif;font-size:clamp(26px,4.3vw,64px);line-height:1.5;word-break:keep-all;color:var(--ghost);opacity:.9;transform-origin:top left;user-select:none}
#ghost.reveal{color:#d1453b;opacity:.75!important}
#ghost,#base{transform-origin:0 0}
canvas.pan{cursor:grab}
.w{display:inline-block;margin:0 .12em}
.tx{max-width:100%}
#ghost.guided .w{border-bottom:3px dotted var(--muted)}
#ghost.guided .t{color:transparent}
#stage.g #base{display:none}
#check{display:none;padding:10px 14px 0;font-size:13px;color:var(--muted)}
#check.show{display:block}
#chips{display:flex;flex-wrap:wrap;direction:rtl;gap:6px;margin-bottom:8px}
.chip{font-family:'Amiri Quran','Amiri',serif;font-size:22px;padding:2px 10px}
.chip.ok{background:#2e8b57;border-color:#2e8b57;color:#fff}
.chip.no{background:#d1453b;border-color:#d1453b;color:#fff}
#prog{display:flex;gap:6px;padding:0 14px 8px;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.dot.part{background:#e0a93b;color:#000;border-color:#e0a93b}
.dot.full{background:#2e8b57;color:#fff;border-color:#2e8b57}
#base{display:none;position:absolute;left:5%;right:5%;top:62%;border-top:2px dotted var(--line);pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
#penCursor{
  position:absolute;
  left:0;top:0;
  z-index:5;
  display:none;
  pointer-events:none;
  transform:translate(-10px,-24px) rotate(-32deg);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));
  user-select:none;
}
#tools{display:flex;gap:8px;padding:10px 14px 12px}
#tools button{flex:1;min-height:46px;padding:8px 2px;font-size:13px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
#sheet.show{display:flex}
#panel{width:100%;box-sizing:border-box;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;box-shadow:0 -12px 48px rgba(0,0,0,.2)}
#panel h3{margin:0 0 6px;font-size:16px}
.srow{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:14px}
.srow .l{width:52px;color:var(--muted);flex:none}
.srow input[type=range]{flex:1;width:auto}
.srow button{min-height:40px}
#zv{min-width:48px;text-align:center;cursor:pointer}
#pv{display:inline-block;border-radius:50%;background:var(--ink);flex:none;width:5px;height:5px}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 14px}
#smp{margin:-4px 0 12px;max-height:34vh;overflow:auto}
.vrow{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.vrow.on{border-color:var(--accent);background:rgba(79,183,141,.14)}
.vrow small{color:var(--muted);font-size:11px}
.vrow div{direction:rtl;text-align:right;font-family:'Amiri Quran','Amiri',serif;font-size:21px;line-height:1.8}
#vtag{position:absolute;top:8px;left:12px;font-size:11px;color:var(--muted);pointer-events:none;z-index:1}
#done{width:100%;min-height:46px;margin-bottom:12px}
#ref{padding:0}
input[type=range]{width:90px;accent-color:var(--accent)}
#ref{font-size:12px;color:var(--muted)}

/* look and feel */
body{background-image:radial-gradient(circle at 50% -8%,var(--glow),transparent 58%);background-attachment:fixed}
button.on{color:var(--on)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{padding:12px 14px 8px;gap:10px;justify-content:flex-start}
.logo{display:flex;flex:none}
.logo svg{width:26px;height:26px;fill:var(--gold);filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
#title{flex:1;text-align:left;color:var(--text);font-size:17px;letter-spacing:.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;gap:8px}
.nav button{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}
#modes button{display:flex;align-items:center;gap:7px;border-radius:12px;padding:9px 14px}
#modes button.on svg{stroke:var(--on)}
#modes button:not(.on) svg{color:var(--gold)}
#stage{border-radius:18px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.05);background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 90%, rgba(0,0,0,.04)));}
#stage::after{content:"";position:absolute;inset:7px;border:1px solid var(--goldsoft);border-radius:12px;pointer-events:none}
#tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;min-height:56px;border-radius:14px}
#tools button svg{color:var(--tint,var(--accent));width:22px;height:22px}
#tools button.on svg{color:var(--on)}
.dot.cur{outline:2px solid var(--gold);outline-offset:1px}
.dot.full{background:var(--accent);border-color:var(--accent);color:var(--on)}
#save{background:var(--gold);border-color:var(--gold);color:#1b1500;font-weight:600}
#panel{border-top:2px solid var(--goldsoft)}
#panel::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
#panel h3{color:var(--gold);letter-spacing:.4px}
#sw{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--surface) inset}
#done{background:var(--accent);border-color:var(--accent);font-weight:600}
#picker{margin:0 14px 10px;padding:12px 12px 10px;border:1px solid var(--goldsoft);border-left:4px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 90%, rgba(0,0,0,.04)));}
#picker .ph{display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--goldsoft)}
#picker .ph svg{width:18px;height:18px}
#pclose{background:transparent;color:var(--muted);border-style:dashed}
#top{position:relative;z-index:15}
#picker{position:absolute;left:14px;right:14px;top:100%;margin:4px 0 0;padding:14px;gap:10px;overflow:hidden;border:1px solid var(--goldsoft);border-radius:18px;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 90%, rgba(0,0,0,.04)));}
#picker::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#picker.show{animation:pk .18s ease-out}
@keyframes pk{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#picker .ph{display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:700;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;padding:2px 0 8px;border-bottom:1px solid var(--goldsoft)}
#pclose{margin-left:auto;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:transparent;border-style:solid;color:var(--muted);border-color:var(--line)}
#pclose svg{width:18px;height:18px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.grid3{display:grid;gap:8px;align-items:end}
#g1{grid-template-columns:1fr 1fr 64px}
#g2{grid-template-columns:96px 64px 1fr}
#picker select,#picker input{width:100%;box-sizing:border-box;height:44px}
#picker .pri{height:44px;background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700;padding:0}
#prog{padding:5px 14px 8px;scrollbar-width:none}
#prog::-webkit-scrollbar{display:none}
.dot.sb{position:relative;margin-left:16px}
.dot.sb::before{content:"";position:absolute;left:-11px;top:2px;bottom:2px;width:2px;background:var(--gold);border-radius:1px}
html,body{touch-action:manipulation}
button,select,input,label,.dot,.vrow,.chip,.sw{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="top"><header>
  <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l2.6 4.2 4.9-1.2-1.2 4.9L22.5 12l-4.2 2.6 1.2 4.9-4.9-1.2L12 22.5l-2.6-4.2-4.9 1.2 1.2-4.9L1.5 12l4.2-2.6-1.2-4.9 4.9 1.2L12 1.5z" fill="currentColor"/></svg></span>
  <button id="title">Al-Fatiha 1:1 ▾</button>
  <div class="nav"><button id="prev" aria-label="Previous"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button id="next" aria-label="Next"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
</header>
<div id="picker">
  <div class="ph"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Choose ayah</span><button id="pclose" aria-label="Close">×</button></div>
  <div class="fld"><label class="fl" for="sur">Surah</label><select id="sur"></select></div>
  <div class="grid3" id="g1">
    <div class="fld"><label class="fl" for="af">From ayah</label><input type="number" id="af" min="1" value="1" inputmode="numeric"></div>
    <div class="fld"><label class="fl" for="at">To ayah</label><input type="number" id="at" min="1" value="7" inputmode="numeric"></div>
    <button id="go" class="pri">Go</button>
  </div>
  <div class="grid3" id="g2">
    <div class="fld"><label class="fl" for="pg">Page</label><input type="number" id="pg" min="1" max="604" placeholder="1-604" inputmode="numeric"></div>
    <button id="gp" class="pri">Go</button>
    <div class="fld"><label class="fl" for="juz">Juz</label><select id="juz"></select></div>
  </div>
</div></div>
<div id="modes">
  <button data-m="trace" class="on"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Trace</button>
  <button data-m="guided"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="4" y1="20" x2="20" y2="20"/></svg>Guided</button>
  <button data-m="memory"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 4.2A10 10 0 0 1 12 4c6.4 0 10 7 10 7a17 17 0 0 1-2.2 3.2"/><path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.6 7 4.6 8.4"/><path d="M17.4 6.6A10 10 0 0 0 12 4"/></svg>Memory</button>
</div>
<div id="prog"></div>
<div id="stage">
  <div id="base"></div>
  <div id="vtag"></div>
  <div id="ghost"></div>
  <canvas id="c"></canvas>
  <div id="penCursor" aria-hidden="true">🪶</div>
</div>
<div id="check"><div id="chips"></div><span id="sc"></span> <button id="save">Save result</button></div>
<div id="tools">
  <button id="undo" style="--tint:#e0a93b"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg><span>Undo</span></button>
  <button id="erase" style="--tint:#e58fa0"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="m10 10 4 4"/></svg><span>Erase</span></button>
  <button id="clear" style="--tint:#e5645a"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Clear</span></button>
  <button id="reveal" style="--tint:#3fb98a"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg><span>Reveal</span></button>
  <button id="pan" style="--tint:#6aa7ff"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v1"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v9"/><path d="m17 13 3 3-3 3"/><path d="m7 13-3 3 3 3"/></svg><span>Pan</span></button>
  <button id="gear" aria-label="Settings" style="--tint:#d9b25a;flex:0 0 52px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.6V20a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.6-1H4a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H10a1.7 1.7 0 0 0 1-1.6V4a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V10a1.7 1.7 0 0 0 1.6 1H20a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1Z"/></svg></button>
</div>
<div id="sheet"><div id="panel">
  <h3>Settings</h3>
  <div class="srow"><span class="l">Text</span><select id="ver" style="flex:1"></select></div>
  <div id="smp"></div>
  <div class="srow"><button id="bm" style="flex:1">Bismillah in first ayah: hidden</button></div>
  <div class="srow"><span class="l">Ghost</span><input type="range" id="op" min="0" max="100" value="22"></div>
  <div class="srow"><span class="l">Pen</span><input type="range" id="pen" min="2" max="14" value="5"><span id="pv"></span></div>
  <div class="srow"><span class="l">Ink</span><div id="sw"></div></div>
  <div class="srow"><span class="l">Eraser</span><input type="range" id="ersz" min="8" max="48" value="18"></div>
  <div class="srow"><span class="l">Zoom</span><button id="zout">−</button><span id="zv">100%</span><button id="zin">+</button><button id="zr">Reset</button></div>
  <div class="hint">Two fingers always move and zoom the page. Turn on Pan to move with one finger.</div>
  <button id="done" class="on">Done</button>
  <div id="ref">Quran text: <a href="http://tanzil.net" target="_blank" rel="noopener">Tanzil.net</a> (<span id="vn">Simple Enhanced</span> v1.0.2, CC BY 3.0, © 2008-2010 Tanzil.net). Stored text is license-compatible and included in this app.</div>
</div></div>
<script>
const QV={"se":[["بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَنِ الرَّحِيمِ","مَالِكِ يَوْمِ الدِّينِ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"]],"sm":[["بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَنِ الرَّحِيمِ","مَالِكِ يَوْمِ الدِّينِ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"]]};
(function(){
  const penCursor = document.getElementById('penCursor');
  const canvas = document.getElementById('c');
  if (!penCursor || !canvas) return;

  function getZoom() {
    const candidates = [
      window.ayahTraceZoom,
      window.zoom,
      window.canvasZoom,
      window.penZoom,
      document.querySelector('#ghost') && getComputedStyle(document.querySelector('#ghost')).scale,
      document.querySelector('#ghost') && getComputedStyle(document.querySelector('#ghost')).transform
    ];

    for (const value of candidates) {
      if (typeof value === 'number' && Number.isFinite(value) && value > 0) return value;
      if (typeof value === 'string') {
        const scale = value.match(/scale\(([-+]?\d*\.?\d+)\)/i);
        if (scale && scale[1]) return Number(scale[1]);
        const matrix = value.match(/matrix\(([-+]?\d*\.?\d+),\s*[-+]?\d*\.?\d+,\s*[-+]?\d*\.?\d+,\s*[-+]?\d*\.?\d+,\s*[-+]?\d*\.?\d+,\s*[-+]?\d*\.?\d+\)/i);
        if (matrix && matrix[1]) return Number(matrix[1]);
      }
    }
    return 1;
  }

  function updatePenCursorSize() {
    const fontSize = 28 * getZoom();
    penCursor.style.fontSize = `${fontSize}px`;
  }

  function movePenCursor(event) {
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    penCursor.style.left = `${x + 10}px`;
    penCursor.style.top = `${y - 18}px`;
    penCursor.style.display = 'block';
    updatePenCursorSize();
  }

  canvas.addEventListener('pointermove', movePenCursor);
  canvas.addEventListener('pointerdown', movePenCursor);
  canvas.addEventListener('pointerleave', () => penCursor.style.display = 'none');
  canvas.addEventListener('pointercancel', () => penCursor.style.display = 'none');
  canvas.addEventListener('pointerup', () => penCursor.style.display = 'none');
  updatePenCursorSize();
})();
</script>
</body>
</html>
